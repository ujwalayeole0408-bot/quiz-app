<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Advanced Quiz App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

  <!-- Dark Mode Toggle -->
  <button
    id="dark-mode-toggle"
    aria-label="Toggle Dark Mode"
  >
    🌙
  </button>

  <!-- Main Container -->
  <main class="container">

    <!-- Login Section -->
    <section id="login-box" class="card">

      <h1>Quiz App 🎯</h1>

      <input
        type="text"
        id="username"
        placeholder="Enter your name"
        autocomplete="off"
      />

      <select id="category">

        <option value="all">
          All Categories
        </option>

        <option value="html">
          HTML
        </option>

        <option value="css">
          CSS
        </option>

        <option value="js">
          JavaScript
        </option>

        <option value="gk">
          General Knowledge
        </option>

      </select>

      <button id="start-btn">
        Start Quiz
      </button>

    </section>

    <!-- Quiz Section -->
    <section id="quiz-box" class="hide card">

      <!-- Top Bar -->
      <div class="top-bar">

        <p id="player-name"></p>

        <p class="timer">
          ⏰ <span id="timer">15</span>s
        </p>

      </div>

      <!-- Progress Bar -->
      <div class="progress-container">

        <div id="progress-bar"></div>

      </div>

      <!-- Question -->
      <h2 id="question">
        Question Text
      </h2>

      <!-- Answer Buttons -->
      <div
        id="answer-buttons"
        class="btn-container"
      ></div>

      <!-- Next Button -->
      <button id="next-btn">
        Next
      </button>

    </section>

    <!-- Result Section -->
    <section id="result-box" class="hide card">

      <h2 id="result-text"></h2>

      <!-- Score Percentage -->
      <p id="score-percent"></p>

      <button id="restart-btn">
        Restart Quiz 🔄
      </button>

    </section>

  </main>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>

</html>
